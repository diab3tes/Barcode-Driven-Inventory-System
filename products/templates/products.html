<!DOCTYPE html>
<html>
<head>
    <title>Product List</title>
    <script src="https://unpkg.com/react@17/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <h2>Product Inventory</h2>
    <div id="app"></div>

    <!-- Output products for debugging -->
    {% if error %}
        <p style="color: red;">Error: {{ error }}</p>
    {% endif %}

    <script type="application/json" id="products-data">
        {{ products|json_script:"products-data" }}
    </script>

    <script type="text/babel">
        try {
            const rawData = document.getElementById("products-data").textContent;
            console.log("Raw JSON data:", rawData); // Debug: Log raw content
            const data = JSON.parse(rawData);
            console.log("Parsed products data:", data); // Debug: Log parsed data

            function ProductList({ products }) {
                if (!products || products.length === 0) {
                    return <p>No products available.</p>;
                }
                return (
                    <ul>
                        {products.map((product, index) => (
                            <li key={product._id || index}>
                                <strong>Barcode:</strong> {product.barcode} |
                                <strong> Material:</strong> {product.material}
                            </li>
                        ))}
                    </ul>
                );
            }

            ReactDOM.render(<ProductList products={data} />, document.getElementById('app'));
        } catch (e) {
            console.error("Error parsing JSON:", e);
            ReactDOM.render(<p>Error loading products: {e.message}</p>, document.getElementById('app'));
        }
    </script>
</body>
</html>
